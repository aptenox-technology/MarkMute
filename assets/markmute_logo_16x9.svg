<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGradWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glowWide" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradWide)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="200" x2="1920" y2="200" stroke="#00d4aa" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="880" x2="1920" y2="880" stroke="#00d4aa" stroke-width="1" opacity="0.05"/>
  <line x1="200" y1="0" x2="200" y2="1080" stroke="#00d4aa" stroke-width="1" opacity="0.05"/>
  <line x1="1720" y1="0" x2="1720" y2="1080" stroke="#00d4aa" stroke-width="1" opacity="0.05"/>

  <!-- Logo mark (left side) -->
  <g transform="translate(280, 240) scale(1.6)">
    <!-- Document shape -->
    <rect x="0" y="0" width="220" height="260" rx="16" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.2"/>

    <!-- Left bar with marks -->
    <rect x="20" y="30" width="28" height="200" rx="14" fill="#e94560" opacity="0.9"/>
    <circle cx="34" cy="60" r="6" fill="#1a1a2e" opacity="0.6"/>
    <rect x="26" y="84" width="16" height="4" rx="2" fill="#1a1a2e" opacity="0.5"/>
    <circle cx="34" cy="114" r="5" fill="#1a1a2e" opacity="0.7"/>
    <rect x="28" y="138" width="12" height="4" rx="2" fill="#1a1a2e" opacity="0.4"/>
    <circle cx="34" cy="164" r="4" fill="#1a1a2e" opacity="0.6"/>
    <rect x="30" y="188" width="10" height="3" rx="1.5" fill="#1a1a2e" opacity="0.5"/>
    <circle cx="34" cy="210" r="5" fill="#1a1a2e" opacity="0.7"/>

    <!-- Right bar clean -->
    <rect x="172" y="30" width="28" height="200" rx="14" fill="#00d4aa"/>
    <circle cx="186" cy="60" r="4" fill="#1a1a2e" opacity="0.8"/>
    <rect x="180" y="84" width="12" height="3" rx="1.5" fill="#1a1a2e" opacity="0.6"/>
    <circle cx="186" cy="114" r="3" fill="#1a1a2e" opacity="0.7"/>
    <rect x="182" y="138" width="10" height="3" rx="1.5" fill="#1a1a2e" opacity="0.5"/>
    <circle cx="186" cy="164" r="4" fill="#1a1a2e" opacity="0.8"/>
    <rect x="182" y="188" width="8" height="2" rx="1" fill="#1a1a2e" opacity="0.6"/>
    <circle cx="186" cy="210" r="3" fill="#1a1a2e" opacity="0.7"/>

    <!-- Mute slash -->
    <line x1="-6" y1="250" x2="226" y2="10" stroke="#f8f9fa" stroke-width="14" stroke-linecap="round" filter="url(#glowWide)"/>
    <line x1="-6" y1="250" x2="226" y2="10" stroke="#00d4aa" stroke-width="8" stroke-linecap="round"/>

    <!-- Fading particles -->
    <circle cx="74" cy="184" r="3" fill="#e94560" opacity="0.3"/>
    <circle cx="99" cy="159" r="2" fill="#e94560" opacity="0.2"/>
    <circle cx="124" cy="134" r="2.5" fill="#e94560" opacity="0.25"/>
    <circle cx="149" cy="109" r="2" fill="#e94560" opacity="0.15"/>
  </g>

  <!-- Wordmark: MarkMute -->
  <text x="780" y="520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="140" font-weight="700" fill="#f8f9fa" letter-spacing="-2">Mark</text>
  <text x="1210" y="520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="140" font-weight="700" fill="#00d4aa" letter-spacing="-2">Mute</text>

  <!-- Tagline -->
  <text x="780" y="600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="300" fill="#f8f9fa" opacity="0.7" letter-spacing="4">SILENCE THE MARKS. PRESERVE THE CONTENT.</text>

  <!-- Decorative line under tagline -->
  <line x1="780" y1="630" x2="1180" y2="630" stroke="#00d4aa" stroke-width="2" opacity="0.5"/>
</svg>