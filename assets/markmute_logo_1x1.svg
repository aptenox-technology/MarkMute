<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Document/page shape (subtle background element) -->
  <rect x="146" y="126" width="220" height="260" rx="16" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.15"/>
  <rect x="156" y="136" width="220" height="260" rx="16" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.1"/>

  <!-- Left bar of "M" with marks (the "marked" side) -->
  <rect x="166" y="156" width="28" height="200" rx="14" fill="#e94560" opacity="0.9"/>

  <!-- Marks on the left bar (representing watermarks) -->
  <circle cx="180" cy="186" r="6" fill="#1a1a2e" opacity="0.6"/>
  <rect x="172" y="210" width="16" height="4" rx="2" fill="#1a1a2e" opacity="0.5"/>
  <circle cx="180" cy="240" r="5" fill="#1a1a2e" opacity="0.7"/>
  <rect x="174" y="264" width="12" height="4" rx="2" fill="#1a1a2e" opacity="0.4"/>
  <circle cx="180" cy="290" r="4" fill="#1a1a2e" opacity="0.6"/>
  <rect x="176" y="314" width="10" height="3" rx="1.5" fill="#1a1a2e" opacity="0.5"/>
  <circle cx="180" cy="336" r="5" fill="#1a1a2e" opacity="0.7"/>

  <!-- Right bar of "M" (the "clean" side) -->
  <rect x="318" y="156" width="28" height="200" rx="14" fill="#00d4aa"/>

  <!-- The MUTE slash - diagonal line crossing through the marks -->
  <line x1="140" y1="376" x2="372" y2="136" stroke="#f8f9fa" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="140" y1="376" x2="372" y2="136" stroke="#00d4aa" stroke-width="8" stroke-linecap="round"/>

  <!-- Center connector of M (subtle, behind the slash) -->
  <path d="M 194 256 L 256 186 L 318 256" fill="none" stroke="#00d4aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- Small "muted" particles fading out near the slash -->
  <circle cx="220" cy="310" r="3" fill="#e94560" opacity="0.3"/>
  <circle cx="245" cy="285" r="2" fill="#e94560" opacity="0.2"/>
  <circle cx="270" cy="260" r="2.5" fill="#e94560" opacity="0.25"/>
  <circle cx="295" cy="235" r="2" fill="#e94560" opacity="0.15"/>

  <!-- Clean indicator on right side -->
  <circle cx="332" cy="186" r="4" fill="#1a1a2e" opacity="0.8"/>
  <rect x="326" y="210" width="12" height="3" rx="1.5" fill="#1a1a2e" opacity="0.6"/>
  <circle cx="332" cy="240" r="3" fill="#1a1a2e" opacity="0.7"/>
  <rect x="328" y="264" width="10" height="3" rx="1.5" fill="#1a1a2e" opacity="0.5"/>
  <circle cx="332" cy="290" r="4" fill="#1a1a2e" opacity="0.8"/>
  <rect x="328" y="314" width="8" height="2" rx="1" fill="#1a1a2e" opacity="0.6"/>
  <circle cx="332" cy="336" r="3" fill="#1a1a2e" opacity="0.7"/>
</svg>