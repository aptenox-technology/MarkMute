services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MAX_FILE_SIZE=268435456
      - UPLOAD_DIR=/app/uploads
      - NOAI_WATERMARK_DIR=/opt/noai-watermark
      - REVERSE_SYNTHID_DIR=/opt/reverse-SynthID
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A app.core.celery worker --loglevel=info -Q pixel_removal,default
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NOAI_WATERMARK_DIR=/opt/noai-watermark
      - REVERSE_SYNTHID_DIR=/opt/reverse-SynthID
    volumes:
      - uploads:/app/uploads
      - noai_watermark:/opt/noai-watermark
      - reverse_synthid:/opt/reverse-SynthID
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  uploads:
  redis_data:
  noai_watermark:
  reverse_synthid: